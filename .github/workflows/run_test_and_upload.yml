name: Chrome Extension Tests

on:
  push:
    branches: ["master"]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # Checkout
      # --------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------
      # Python setup
      # --------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------
      # Playwright setup
      # --------------------------
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # --------------------------
      # Test results directories
      # --------------------------
      - name: Create test results directories
        run: |
          mkdir -p test-results/screenshots
          mkdir -p test-results/traces

      # --------------------------
      # Authenticate to GCP
      # --------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # --------------------------
      # Read extension version → ENV
      # --------------------------
      - name: Read Chrome Extension version
        run: |
          if [ ! -f glass_ce_version.txt ]; then
            echo "glass_ce_version.txt not found"
            exit 1
          fi

          GLASS_CE_VERSION=$(cat glass_ce_version.txt | tr -d ' \n')
          echo "GLASS_CE_VERSION=$GLASS_CE_VERSION" >> $GITHUB_ENV

          echo "Using extension version: $GLASS_CE_VERSION"

      # --------------------------
      # Download extension ZIP from glass_ce bucket
      # --------------------------
      - name: Download Chrome Extension from GCS
        run: |
          ZIP_NAME="glass_ce_${GLASS_CE_VERSION}.zip"

          echo "Downloading $ZIP_NAME from gs://glass_ce/"
          gsutil cp "gs://glass_ce/$ZIP_NAME" extension.zip

          unzip extension.zip -d chrome-extension

          if [ ! -f chrome-extension/manifest.json ]; then
            echo "ERROR: manifest.json not found"
            exit 1
          fi

      # --------------------------
      # Resolve latest template file
      # --------------------------
      - name: Resolve latest template file
        run: |
          LATEST_TEMPLATE=$(ls template*.html 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_TEMPLATE" ]; then
            echo "No template file found"
            exit 1
          fi

          FULL_PATH="${{ github.workspace }}/$LATEST_TEMPLATE"
          echo "TEMPLATE_FILE_PATH=$FULL_PATH" >> $GITHUB_ENV

          echo "Using template: $LATEST_TEMPLATE"

      # --------------------------
      # Run Playwright tests
      # --------------------------
      - name: Run tests
        env:
          EXTENSION_PATH: ${{ github.workspace }}/chrome-extension
          GLASS_USERNAME: ${{ secrets.GLASS_USERNAME }}
          GLASS_PASSWORD: ${{ secrets.GLASS_PASSWORD }}
        run: |
          echo "Running tests with extension version: $GLASS_CE_VERSION"
          pytest

      # --------------------------
      # ✅ Upload template to avrl-glass bucket (ROOT, overwrite)
      # --------------------------
      - name: Upload HTML template to GCS
        if: success()
        run: |
          FILE_NAME=$(basename "$TEMPLATE_FILE_PATH")

          echo "Uploading $FILE_NAME to gs://avrl-glass/"
          gsutil cp "$TEMPLATE_FILE_PATH" "gs://avrl-glass/$FILE_NAME"

      # --------------------------
      # Upload test results artifacts
      # --------------------------
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/screenshots/
            test-results/*.json
            test-results/report.html
            test-results/traces/
          retention-days: 30
          if-no-files-found: warn

      # --------------------------
      # Teams notification
      # --------------------------
      - name: Send Teams Notification
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL secret not set"
            exit 1
          fi

          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="PASSED"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="FAILED"
          fi

          ARTIFACT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          cat <<EOF > payload.json
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "Chrome Extension Test Results",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "Status", "value": "$STATUS_EMOJI $STATUS_TEXT" },
                        { "title": "Extension Version", "value": "$GLASS_CE_VERSION" },
                        { "title": "Branch", "value": "${{ github.ref_name }}" },
                        { "title": "Commit", "value": "${{ github.sha }}" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "[View Workflow Run]($ARTIFACT_URL)",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }
          EOF

          echo "Sending Teams notification..."
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

          echo "Teams notification sent successfully"

